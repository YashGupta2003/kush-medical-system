name: CI — Backend Tests + Frontend Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: pytest with MySQL (mirrors the real production database engine)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python/FastAPI)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: kush_medical_test
        ports:
          - 3306:3306
        # Wait for MySQL to be actually ready before tests start
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      # Tests use SQLite in-memory by default (see conftest.py).
      # These env vars are set for any integration test that spins up against MySQL.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test_root_password
      DB_NAME: kush_medical_test
      REDIS_URL: redis://localhost:6379/0
      # TESTING=true: tells config.py to skip the jwt_secret enforcement guard
      # (same detection that cache.py already uses for test environments).
      TESTING: "true"
      JWT_SECRET_KEY: "ci-test-secret-key-not-for-production-use"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        working-directory: backend
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v \
            --tb=short \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Frontend: Vitest unit tests + Vite production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test -- --run --reporter=verbose
        # Note: --run ensures Vitest exits after tests (no watch mode in CI).

      - name: Build production bundle (validates no build errors)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # Security: dependency vulnerability scan
  # ---------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        # pip-audit --fix is NOT used in CI — human review required for dependency updates.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-w3h3-4rj7-4ph4 || true
        # || true: don't block CI on low/medium vulns — only fail on critical (configured in org policy).
